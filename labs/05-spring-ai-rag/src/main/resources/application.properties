spring.application.name=05-spring-ai-rag
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/rag
spring.datasource.username=rag
spring.datasource.password=rag

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:4b
spring.ai.ollama.embedding.model=embeddinggemma

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# SimpleLoggerAdvisor пише промпт і відповідь на рівні DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
