services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5433:5432"   # 5433 на хості, щоб не конфліктувати з іншим Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
