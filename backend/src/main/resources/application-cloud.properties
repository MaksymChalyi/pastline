# Профіль cloud: онлайн-демо (Render + Neon + Vercel). Секрети лише зі змінних середовища, ніколи в Git.
# Числа експерименту з цим профілем не рахуються: тут інша модель ембедінгів і відповідей.

# Render передає порт у змінній PORT
server.port=${PORT:8090}
# За проксі Render і Vercel: схема й адреса клієнта з X-Forwarded-*
server.forward-headers-strategy=framework
# Сайт відкривається лише через HTTPS, тож cookie сесії не йде відкритим каналом
server.servlet.session.cookie.secure=true

# Neon: SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Безкоштовний Neon: мало з'єднань достатньо, а кожне коштує пам'яті на 512 МБ Render
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# AI через Gemini API замість Ollama (Ollama не поміститься в 512 МБ)
pastline.ai.provider=gemini
pastline.gemini.api-key=${GEMINI_API_KEY}
pastline.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
pastline.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
# Автоконфігурація Spring AI для Ollama не потрібна
spring.ai.model.chat=none
spring.ai.model.embedding=none

# Безкоштовний рівень Gemini: до 100 запитів на хвилину для ембедінгів; пачка 32 записи раз на 3 с — із запасом
pastline.embedding.worker.delay-ms=3000
