# Профіль бенчмарку (6.9): без веб-сервера, без фонового індексатора (раннер індексує сам і чекає завершення)
spring.main.web-application-type=none
pastline.embedding.worker.enabled=false

# Шляхи відносно папки backend
pastline.benchmark.corpus=../docs/experiments/corpus-v1/corpus.json
pastline.benchmark.queries=../docs/experiments/queries-v1
pastline.benchmark.output=../docs/experiments/results
pastline.benchmark.user=benchmark@pastline.local
pastline.benchmark.warmup=5
pastline.benchmark.repeats=20
