spring.application.name=pastline-backend
# 8080 на цьому ноутбуці зайнятий системною службою
server.port=${PASTLINE_PORT:8090}

# 5432 на цьому ноутбуці зайнятий локальним PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${PASTLINE_DB_PORT:5434}/pastline
spring.datasource.username=${PASTLINE_DB_USER:pastline}
spring.datasource.password=${PASTLINE_DB_PASSWORD:pastline}

# Схема лише через Flyway; Hibernate тільки перевіряє відповідність сутностей
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
