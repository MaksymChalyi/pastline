spring.application.name=pastline-backend
# Необов'язковий .env у корені репозиторію (mvnw запускається з backend/); без файлу нічого не змінюється
spring.config.import=optional:file:../.env[.properties]
# 8080 на цьому ноутбуці зайнятий системною службою
server.port=${PASTLINE_PORT:8090}

# 5432 на цьому ноутбуці зайнятий локальним PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${PASTLINE_DB_PORT:5434}/pastline?reWriteBatchedInserts=true
spring.datasource.username=${PASTLINE_DB_USER:pastline}
spring.datasource.password=${PASTLINE_DB_PASSWORD:pastline}

# Схема лише через Flyway; Hibernate тільки перевіряє відповідність сутностей
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Пакетні INSERT для імпорту: Hibernate групує по 100, драйвер PostgreSQL зливає їх у багаторядкові INSERT
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

management.endpoints.web.exposure.include=health

# Сесійна cookie недоступна з JavaScript і не йде з чужих сайтів
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Імпорт: файл до 5 MB (Spring за замовчуванням дозволяє лише 1 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Звідки беруться ембедінги й відповіді: ollama (локально, експеримент) або gemini (профіль cloud, онлайн-демо)
pastline.ai.provider=ollama

# Ollama: ембедінги для семантичного пошуку (і чат для Ask Pastline у 6.10)
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=embeddinggemma
# instruct-варіант: qwen3:4b у реєстрі Ollama = qwen3:4b-thinking-2507, що міркує перед кожною відповіддю
spring.ai.ollama.chat.model=qwen3:4b-instruct
# Префікси з model card EmbeddingGemma; false відтворює умови EXP-000 (Лаба 03, без префіксів)
pastline.embedding.use-prompts=true
# Фоновий індексатор: пауза між пачками
pastline.embedding.worker.delay-ms=2000

# Гібридний пошук: k у RRF, score = Σ 1/(k + rank). 60 - значення з оригінальної статті про RRF
pastline.search.rrf-k=60
# Лексичний пошук: and = усі слова запиту (синтаксис websearch), or = будь-яке слово довжиною від 3 символів
pastline.search.lexical-operator=and

# Ask Pastline (6.10): скільки записів іде в контекст, скільки символів з кожного, температура моделі
pastline.ask.top-k=8
pastline.ask.max-entry-chars=1500
pastline.ask.temperature=0.2
# Межа довжини відповіді моделі в токенах
pastline.ask.max-tokens=400
# Модель на CPU відповідає десятки секунд; тайм-аут читання для HTTP-клієнтів (і Ollama)
spring.http.clients.read-timeout=300s
# Без повторів: повтор після тайм-ауту лише подвоює очікування, а помилку користувач однаково отримає
spring.ai.retry.max-attempts=1
